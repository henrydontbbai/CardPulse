# ============================================================================
# CardPulse 配置文件
# ============================================================================
# 复制此文件为 config.yaml 并填入你的配置
# cp config.example.yaml ~/.cardpulse/config.yaml
# ============================================================================

# 4G 模组管理服务配置
gateway:
  # 管理服务地址
  # 如果服务运行在本机，保持默认即可
  url: "http://localhost:7575"
  
  # API 认证 token（可选）
  # 如果在管理后台中启用了 API 认证，需要填入 token
  # 否则留空
  token: ""

# 设备配置
device:
  # 设备 ID（可选）
  # 留空则自动使用所有可用设备
  # 指定设备 ID 则只使用该设备发送短信
  # 
  # 如何查看设备 ID：
  # 1. 登录管理后台
  # 2. 进入「设备管理」
  # 3. 点击设备查看详细信息中的 ID
  id: ""

# 短信配置
sms:
  # 接收短信的手机号码
  # 必须包含国家代码
  # 例如：+1 表示美国，+86 表示中国
  phone: "+1234567890"
  
  # 短信内容
  # 任意内容即可，只要能成功发送
  # Google Voice 卡保号只需有发送记录
  message: "Hello from CardPulse"
  
  # 保号间隔天数
  # Google Voice 卡建议设置为 179 天（略小于 180 天限制）
  interval_days: 179

# 通知配置（可选）
notify:
  # 是否启用通知
  enabled: false
  
  # Telegram 通知
  # 需要先创建 Telegram Bot 并获取 token
  telegram:
    bot_token: ""
    chat_id: ""
  
  # Bark 通知（iOS 推送）
  # 需要安装 Bark 应用并获取推送 key
  bark:
    url: ""
  
  # Webhook 通知
  webhook:
    url: ""
    method: "POST"
    headers:
      Content-Type: "application/json"

# ============================================================================
# 高级配置（通常无需修改）
# ============================================================================

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARN, ERROR
  level: "INFO"
  
  # 日志文件路径（相对于配置目录）
  file: "logs/cardpulse.log"
  
  # 日志文件最大大小（MB）
  max_size: 10
  
  # 保留日志文件数量
  max_backups: 5

# 重试配置
retry:
  # 发送失败时重试次数
  max_attempts: 3
  
  # 重试间隔（秒）
  interval: 10
